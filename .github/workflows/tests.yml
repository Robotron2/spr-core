name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

# CI-safe defaults. Override these with repository/environment secrets if tests
# need authenticated Stellar, Soroban, or Redis services.
env:
  NODE_ENV: test
  PORT: 4000
  STELLAR_NETWORK: testnet
  STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
  SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
  REDIS_URL: redis://localhost:6379
  LOG_LEVEL: info
  API_KEY: ci-test-api-key

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 20.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests with coverage
        run: |
          # Prefer the requested granular script, but keep CI usable for the
          # current package.json which only defines test and test:coverage.
          if node -e "process.exit(require('./package.json').scripts['test:unit'] ? 0 : 1)"; then
            npm run test:unit -- --coverage --coverageDirectory=coverage --coverageReporters=lcov --coverageReporters=json-summary
          else
            npm test -- --coverage --coverageDirectory=coverage --coverageReporters=lcov --coverageReporters=json-summary
          fi

      - name: Run integration tests
        run: |
          # Integration tests are required once the script exists.
          if node -e "process.exit(require('./package.json').scripts['test:integration'] ? 0 : 1)"; then
            npm run test:integration
          else
            echo "No test:integration script found; skipping integration test step."
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: node-${{ matrix.node-version }}
          name: spr-core-node-${{ matrix.node-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare coverage comment
        if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
        run: |
          {
            echo "## Coverage Report"
            echo ""
            if [ -f coverage/coverage-summary.json ]; then
              node -e 'const s=require("./coverage/coverage-summary.json").total; for (const [k,v] of Object.entries(s)) console.log(`- ${k}: ${v.pct}% (${v.covered}/${v.total})`)'
            else
              echo "Coverage summary was not generated. See the uploaded coverage artifact for details."
            fi
          } > coverage-comment.md

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage-comment.md
